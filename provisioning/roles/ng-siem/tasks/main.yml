# ── Step 7: restart Wazuh manager ────────────────────────────────────────────
 
- name: Restart wazuh-manager (native systemd)
  ansible.builtin.systemd:
    name: wazuh-manager
    state: restarted
    enabled: yes
  when: wazuh_mode == "native"
 
- name: Restart Wazuh manager container (docker mode)
  ansible.builtin.command:
    cmd: docker restart {{ wazuh_container }}
  when: wazuh_mode == "docker"
  changed_when: true
 
- name: Wait for Wazuh manager to come back up
  ansible.builtin.pause:
    seconds: 15
 
# ── Step 8: verify Wazuh manager is running ───────────────────────────────────
 
- name: Check Wazuh manager status (native)
  ansible.builtin.command: /var/ossec/bin/wazuh-control status
  register: wazuh_status
  changed_when: false
  failed_when: false
  when: wazuh_mode == "native"
 
- name: Check Wazuh manager container status (docker)
  ansible.builtin.command: docker ps --filter "name={{ wazuh_container }}" --format "{{ '{{' }}.Status{{ '}}' }}"
  register: wazuh_container_status
  changed_when: false
  when: wazuh_mode == "docker"
 
- name: Show Wazuh status
  ansible.builtin.debug:
    msg: "{{ wazuh_status.stdout_lines | default(wazuh_container_status.stdout_lines | default(['unknown'])) }}"
