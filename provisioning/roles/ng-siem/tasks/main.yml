---
# 2. FILE SYSTEM & DIRECTORY FIXES (The "Wazuh-Indexer" fix)
- name: Create missing Wazuh Indexer log directory
  file:
    path: /var/log/wazuh-indexer
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0755'

# 3. NETWORKING & HOST RESOLUTION (The "Loopback" fix)
- name: Configure internal routing in /etc/hosts
  block:
    - name: Restore standard localhost entry
      lineinfile:
        path: /etc/hosts
        regexp: '^127.0.0.1'
        line: "127.0.0.1 localhost"

- name: Map SIEM FQDNs to Internal Pentest IP (ens4)
  lineinfile:
    path: /etc/hosts
    # This regex ensures we replace ANY existing entry for the domain
    regexp: '.*{{ item }}$'
    # Use ens4 specifically to avoid the 192.168.x.x management IP
    line: "{{ ansible_ens4.ipv4.address }} {{ item }}"
    state: present
  loop:
    - wazuh-indexer.mini.ngsiem.sph.gr
    - wazuh-manager.mini.ngsiem.sph.gr
    - wazuh-dashboard.mini.ngsiem.sph.gr
    - fluentd.mini.ngsiem.sph.gr
    - keycloak.mini.ngsiem.sph.gr
    - postgres.keycloak.mini.ngsiem.sph.gr
    - misp.mini.ngsiem.sph.gr
    - mariadb.misp.mini.ngsiem.sph.gr
    - redis.misp.mini.ngsiem.sph.gr
    - modules.misp.mini.ngsiem.sph.gr
    - zookeeper.mini.ngsiem.sph.gr
    - kafka.mini.ngsiem.sph.gr
    - ui.kafka.mini.ngsiem.sph.gr
    - navigator.mini.ngsiem.sph.gr
    - db.backend.mini.ngsiem.sph.gr
    - cache.backend.mini.ngsiem.sph.gr
    - backend.mini.ngsiem.sph.gr
    - guacamole.mini.ngsiem.sph.gr
    - iframe.mini.ngsiem.sph.gr
    - app.mini.ngsiem.sph.gr

- name: Restart Docker to apply new networking
  systemd:
    name: docker
    state: restarted

# 4. SERVICE RECOVERY
- name: Ensure Wazuh Indexer and Docker are restarted
  systemd:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  loop:
    - wazuh-indexer
    - wazuh-manager
    - docker

- name: Wait for Wazuh Indexer API to be ready (Port 9200)
  wait_for:
    port: 9200
    delay: 10
    timeout: 300

- name: Run Wazuh Dashboard Init (Imports Patterns)
  shell: "docker start wazuh-dashboard-init"
  register: init_result
  failed_when: false # It's okay if this is already finished
  changed_when: "init_result.rc == 0"

- name: Start Pandora UI Container
  docker_container:
    name: ui
    state: started
  register: ui_status

- name: Start SIEM Backend Engine
  docker_container:
    name: backend
    state: started
  register: backend_status

- name: Start Alerts Correlator
  docker_container:
    name: alerts-correlator
    state: started
  register: correlator_status

- name: Ensure Native Wazuh Dashboard Service is Running
  systemd:
    name: wazuh-dashboard
    state: started
    enabled: yes
  register: native_dash_status


## API Key Integrations ───────────────────────────────────────────────────────────────────
# Verify facts arrived from docker-server role ────────────────────────────────────
- name: Assert MISP API key was passed from docker-server role
  ansible.builtin.assert:
    that:
      - hostvars['docker-server']['misp_api_key'] is defined
      - hostvars['docker-server']['misp_api_key'] | trim != ''
    fail_msg: >
      misp_api_key is not set in hostvars['docker-server'].
      Ensure the docker-server role ran first AND set cacheable: yes on the fact.
      Also confirm your inventory hostname for that host is exactly 'docker-server'.

- name: Assert DFIR-IRIS API key was passed from docker-server role
  ansible.builtin.assert:
    that:
      - hostvars['docker-server']['iris_api_key'] is defined
      - hostvars['docker-server']['iris_api_key'] | trim != ''
    fail_msg: >
      iris_api_key is not set in hostvars['docker-server'].
      Same checklist as above.

# ── Step 1: find out WHY wazuh-manager is failing ────────────────────────────
 
- name: Get wazuh-manager journal (last 30 lines)
  ansible.builtin.command:
    cmd: journalctl -u wazuh-manager -n 30 --no-pager
  register: wazuh_journal
  changed_when: false
  failed_when: false
 
- name: Show wazuh-manager journal
  ansible.builtin.debug:
    var: wazuh_journal.stdout_lines
 
- name: Check ossec.conf syntax with wazuh-manager directly
  ansible.builtin.command:
    cmd: /var/ossec/bin/wazuh-manager --test-config
  register: wazuh_config_test
  changed_when: false
  failed_when: false
  ignore_errors: true
 
- name: Show ossec.conf test result
  ansible.builtin.debug:
    msg:
      - "rc: {{ wazuh_config_test.rc }}"
      - "stdout: {{ wazuh_config_test.stdout_lines | default([]) }}"
      - "stderr: {{ wazuh_config_test.stderr_lines | default([]) }}"
 
# ── Step 2: check current ossec.conf for any broken/partial blocks ───────────
 
- name: Check if ossec.conf has any broken ANSIBLE markers from previous runs
  ansible.builtin.shell: |
    grep -n "ANSIBLE MANAGED\|BEGIN ANSIBLE\|END ANSIBLE" /var/ossec/etc/ossec.conf || echo "NO_MARKERS"
  register: ossec_markers
  changed_when: false
 
- name: Show existing markers in ossec.conf
  ansible.builtin.debug:
    var: ossec_markers.stdout_lines
 
- name: Show tail of ossec.conf (last 40 lines)
  ansible.builtin.command:
    cmd: tail -40 /var/ossec/etc/ossec.conf
  register: ossec_tail
  changed_when: false
 
- name: Display ossec.conf tail
  ansible.builtin.debug:
    var: ossec_tail.stdout_lines
 
# ── Step 3: remove any broken/partial integration block from previous runs ───
 
- name: Remove any previous ANSIBLE MANAGED integration block
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED CYBERRANGE INTEGRATIONS -->"
    state: absent
  ignore_errors: true
 
# ── Step 4: validate ossec.conf is clean before proceeding ───────────────────
 
- name: Validate ossec.conf XML is well-formed
  ansible.builtin.shell: |
    python3 -c "
    import xml.etree.ElementTree as ET
    try:
        ET.parse('/var/ossec/etc/ossec.conf')
        print('XML_OK')
    except ET.ParseError as e:
        print(f'XML_ERROR: {e}')
    "
  register: ossec_xml_check
  changed_when: false
 
- name: Show XML validation result
  ansible.builtin.debug:
    var: ossec_xml_check.stdout
 
- name: FAIL if ossec.conf is malformed XML
  ansible.builtin.fail:
    msg: >
      ossec.conf has XML errors: {{ ossec_xml_check.stdout }}
      Fix the file manually before proceeding.
      Check the tail output above for the broken section.
  when: "'XML_ERROR' in ossec_xml_check.stdout"
 
# ── Step 5: deploy custom-iris integration script ────────────────────────────
 
- name: Ensure Wazuh integrations directory exists
  ansible.builtin.file:
    path: /var/ossec/integrations
    state: directory
    owner: root
    group: wazuh
    mode: '0750'
 
- name: Deploy custom-iris integration script
  ansible.builtin.copy:
    dest: /var/ossec/integrations/custom-iris
    owner: root
    group: wazuh
    mode: '0750'
    content: |
      #!/usr/bin/env python3
      import sys, json, requests, urllib3
      urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
      alert_file = sys.argv[1]
      api_key    = sys.argv[2]
      hook_url   = sys.argv[3]
      with open(alert_file) as f:
          alert = json.load(f)
      rule  = alert.get("rule", {})
      agent = alert.get("agent", {})
      payload = {
          "alert_title":       rule.get("description", "Wazuh Alert"),
          "alert_description": json.dumps(alert, indent=2),
          "alert_source":      "Wazuh",
          "alert_source_ref":  alert.get("id", ""),
          "alert_source_link": "",
          "alert_severity_id": 2,
          "alert_status_id":   2,
          "alert_source_content": alert,
          "alert_context": {
              "agent_name":  agent.get("name", ""),
              "agent_id":    agent.get("id", ""),
              "rule_id":     rule.get("id", ""),
              "rule_level":  rule.get("level", 0),
              "rule_groups": rule.get("groups", []),
          }
      }
      headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}
      try:
          r = requests.post(hook_url, json=payload, headers=headers, verify=False, timeout=10)
          r.raise_for_status()
      except requests.exceptions.RequestException as e:
          print(f"ERROR: {e}", file=sys.stderr)
          sys.exit(1)
      sys.exit(0)
 
# ── Step 6: inject integration block into ossec.conf ─────────────────────────
 
- name: Inject MISP and DFIR-IRIS integrations into ossec.conf
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertbefore: "</ossec_config>"
    marker: "<!-- {mark} ANSIBLE MANAGED CYBERRANGE INTEGRATIONS -->"
    block: |
      <!-- Integration with CTI-SS (MISP) -->
      <integration>
        <name>misp</name>
        <api_key>{{ hostvars['docker-server']['misp_api_key'] }}</api_key>
        <url>https://10.0.12.60:8443</url>
        <alert_format>json</alert_format>
      </integration>
 
      <!-- Integration with CICMS (DFIR-IRIS) -->
      <integration>
        <name>custom-iris</name>
        <hook_url>http://10.0.12.60:8083/api/v1/alerts/add</hook_url>
        <api_key>{{ hostvars['docker-server']['iris_api_key'] }}</api_key>
        <level>7</level>
        <alert_format>json</alert_format>
      </integration>
 
# ── Step 7: validate the updated ossec.conf before restarting ────────────────
 
- name: Validate ossec.conf XML after injection
  ansible.builtin.shell: |
    python3 -c "
    import xml.etree.ElementTree as ET
    try:
        ET.parse('/var/ossec/etc/ossec.conf')
        print('XML_OK')
    except ET.ParseError as e:
        print(f'XML_ERROR: {e}')
    "
  register: ossec_xml_check_after
  changed_when: false
 
- name: Show XML validation result after injection
  ansible.builtin.debug:
    var: ossec_xml_check_after.stdout
 
- name: FAIL if ossec.conf is malformed after injection
  ansible.builtin.fail:
    msg: "ossec.conf has XML errors after injection: {{ ossec_xml_check_after.stdout }}"
  when: "'XML_ERROR' in ossec_xml_check_after.stdout"
 
# ── Step 8: restart wazuh-manager ────────────────────────────────────────────
 
- name: Restart wazuh-manager
  ansible.builtin.systemd:
    name: wazuh-manager
    state: restarted
    enabled: yes
 
- name: Wait for wazuh-manager to come up
  ansible.builtin.pause:
    seconds: 10
 
- name: Check wazuh-manager status
  ansible.builtin.command:
    cmd: /var/ossec/bin/wazuh-control status
  register: wazuh_status
  changed_when: false
  failed_when: false
 
- name: Show wazuh-manager status
  ansible.builtin.debug:
    var: wazuh_status.stdout_lines
