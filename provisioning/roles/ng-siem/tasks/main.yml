---
# 2. FILE SYSTEM & DIRECTORY FIXES (The "Wazuh-Indexer" fix)
- name: Create missing Wazuh Indexer log directory
  file:
    path: /var/log/wazuh-indexer
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0755'

# 3. NETWORKING & HOST RESOLUTION (The "Loopback" fix)
- name: Configure internal routing in /etc/hosts
  block:
    - name: Restore standard localhost entry
      lineinfile:
        path: /etc/hosts
        regexp: '^127.0.0.1'
        line: "127.0.0.1 localhost"

- name: Map SIEM FQDNs to Internal Pentest IP (ens4)
  lineinfile:
    path: /etc/hosts
    # This regex ensures we replace ANY existing entry for the domain
    regexp: '.*{{ item }}$'
    # Use ens4 specifically to avoid the 192.168.x.x management IP
    line: "{{ ansible_ens4.ipv4.address }} {{ item }}"
    state: present
  loop:
    - wazuh-indexer.mini.ngsiem.sph.gr
    - wazuh-manager.mini.ngsiem.sph.gr
    - wazuh-dashboard.mini.ngsiem.sph.gr
    - fluentd.mini.ngsiem.sph.gr
    - keycloak.mini.ngsiem.sph.gr
    - postgres.keycloak.mini.ngsiem.sph.gr
    - misp.mini.ngsiem.sph.gr
    - mariadb.misp.mini.ngsiem.sph.gr
    - redis.misp.mini.ngsiem.sph.gr
    - modules.misp.mini.ngsiem.sph.gr
    - zookeeper.mini.ngsiem.sph.gr
    - kafka.mini.ngsiem.sph.gr
    - ui.kafka.mini.ngsiem.sph.gr
    - navigator.mini.ngsiem.sph.gr
    - db.backend.mini.ngsiem.sph.gr
    - cache.backend.mini.ngsiem.sph.gr
    - backend.mini.ngsiem.sph.gr
    - guacamole.mini.ngsiem.sph.gr
    - iframe.mini.ngsiem.sph.gr
    - app.mini.ngsiem.sph.gr

- name: Restart Docker to apply new networking
  systemd:
    name: docker
    state: restarted

# 4. SERVICE RECOVERY
- name: Ensure Wazuh Indexer and Docker are restarted
  systemd:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  loop:
    - wazuh-indexer
    - wazuh-manager
    - docker

- name: Wait for Wazuh Indexer API to be ready (Port 9200)
  wait_for:
    port: 9200
    delay: 10
    timeout: 300

- name: Run Wazuh Dashboard Init (Imports Patterns)
  shell: "docker start wazuh-dashboard-init"
  register: init_result
  failed_when: false # It's okay if this is already finished
  changed_when: "init_result.rc == 0"

- name: Start Pandora UI Container
  docker_container:
    name: ui
    state: started
  register: ui_status

- name: Start SIEM Backend Engine
  docker_container:
    name: backend
    state: started
  register: backend_status

- name: Start Alerts Correlator
  docker_container:
    name: alerts-correlator
    state: started
  register: correlator_status

- name: Ensure Native Wazuh Dashboard Service is Running
  systemd:
    name: wazuh-dashboard
    state: started
    enabled: yes
  register: native_dash_status


## API Key Integrations ───────────────────────────────────────────────────────────────────
# Verify facts arrived from docker-server role ────────────────────────────────────
- name: Assert MISP API key was passed from docker-server role
  ansible.builtin.assert:
    that:
      - hostvars['docker-server']['misp_api_key'] is defined
      - hostvars['docker-server']['misp_api_key'] | trim != ''
    fail_msg: >
      misp_api_key is not set in hostvars['docker-server'].
      Ensure the docker-server role ran first AND set cacheable: yes on the fact.
      Also confirm your inventory hostname for that host is exactly 'docker-server'.

- name: Assert DFIR-IRIS API key was passed from docker-server role
  ansible.builtin.assert:
    that:
      - hostvars['docker-server']['iris_api_key'] is defined
      - hostvars['docker-server']['iris_api_key'] | trim != ''
    fail_msg: >
      iris_api_key is not set in hostvars['docker-server'].
      Same checklist as above.

# Install the custom DFIR-IRIS integration script ────────────────────────────────────
- name: Ensure Wazuh integrations directory exists
  ansible.builtin.file:
    path: /var/ossec/integrations
    state: directory
    owner: root
    group: wazuh
    mode: '0750'

- name: Deploy custom DFIR-IRIS integration script
  ansible.builtin.copy:
    dest: /var/ossec/integrations/custom-iris
    owner: root
    group: wazuh
    mode: '0750'
    content: |
      #!/usr/bin/env python3
      # Wazuh → DFIR-IRIS alert forwarder
      # Installed by Ansible — do not edit manually
      import sys, json, os, requests, urllib3
      urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

      alert_file  = sys.argv[1]
      api_key     = sys.argv[2]
      hook_url    = sys.argv[3]

      with open(alert_file) as f:
          alert = json.load(f)

      rule    = alert.get("rule", {})
      agent   = alert.get("agent", {})
      data    = alert.get("data", {})

      payload = {
          "alert_title":       rule.get("description", "Wazuh Alert"),
          "alert_description": json.dumps(alert, indent=2),
          "alert_source":      "Wazuh",
          "alert_source_ref":  alert.get("id", ""),
          "alert_source_link": "",
          "alert_severity_id": 2,   # 1=Info 2=Low 3=Medium 4=High 5=Critical
          "alert_status_id":   2,   # 1=Unspecified 2=New 3=Assigned 4=InProgress
          "alert_source_content": alert,
          "alert_context": {
              "agent_name": agent.get("name", ""),
              "agent_id":   agent.get("id", ""),
              "rule_id":    rule.get("id", ""),
              "rule_level": rule.get("level", 0),
              "rule_groups": rule.get("groups", []),
          }
      }

      headers = {
          "Authorization": f"Bearer {api_key}",
          "Content-Type":  "application/json",
      }

      try:
          r = requests.post(hook_url, json=payload, headers=headers,
                            verify=False, timeout=10)
          r.raise_for_status()
      except requests.exceptions.RequestException as e:
          print(f"ERROR sending alert to DFIR-IRIS: {e}", file=sys.stderr)
          sys.exit(1)

      print(f"Alert forwarded: HTTP {r.status_code}")
      sys.exit(0)

# Wazuh also expects a .py wrapper file with the same base name ───────────────
- name: Deploy custom-iris Python shim (Wazuh ≥ 4.4 requirement)
  ansible.builtin.copy:
    dest: /var/ossec/integrations/custom-iris.py
    owner: root
    group: wazuh
    mode: '0750'
    content: |
      #!/usr/bin/env python3
      # Thin shim — actual logic is in custom-iris (no extension)
      import subprocess, sys
      sys.exit(subprocess.call(["/var/ossec/integrations/custom-iris"] + sys.argv[1:]))

# Inject integration blocks into ossec.conf ─────────────────────────────────

- name: Inject MISP and DFIR-IRIS integrations into Wazuh ossec.conf
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertbefore: "</ossec_config>"
    marker: "<!-- {mark} ANSIBLE MANAGED CYBERRANGE INTEGRATIONS -->"
    block: |
      <!-- Integration with CTI-SS (MISP) -->
      <integration>
        <name>misp</name>
        <api_key>{{ hostvars['docker-server']['misp_api_key'] }}</api_key>
        <url>https://10.0.12.60:8443</url>
        <alert_format>json</alert_format>
      </integration>

      <!-- Integration with CICMS (DFIR-IRIS) — only forward level >= 7 -->
      <integration>
        <name>custom-iris</name>
        <hook_url>http://10.0.12.60:8083/api/v1/alerts/add</hook_url>
        <api_key>{{ hostvars['docker-server']['iris_api_key'] }}</api_key>
        <level>7</level>
        <alert_format>json</alert_format>
      </integration>

# Validate ossec.conf before restarting ────────────────────────────────────

- name: Validate Wazuh configuration syntax
  ansible.builtin.command: /var/ossec/bin/wazuh-logtest -t
  register: wazuh_config_check
  changed_when: false
  failed_when:
    - wazuh_config_check.rc != 0
    - "'ERROR' in wazuh_config_check.stderr"
  ignore_errors: true

- name: Show config validation output
  ansible.builtin.debug:
    var: wazuh_config_check.stdout_lines
  when: wazuh_config_check is defined

- name: Restart Wazuh Manager
  ansible.builtin.systemd:
    name: wazuh-manager
    state: restarted
    enabled: yes

- name: Wait for Wazuh Manager to come back up
  ansible.builtin.wait_for:
    port: 55000
    host: 127.0.0.1
    delay: 5
    timeout: 60

# INTEGRATION TESTS ────────────────────────────────────
# ── Test 1: Wazuh → MISP connectivity ────────────────────────────────────────

- name: "[TEST] Wazuh → MISP: check API reachability"
  ansible.builtin.uri:
    url: "https://10.0.12.60:8443/servers/getVersion"
    method: GET
    headers:
      Authorization: "{{ hostvars['docker-server']['misp_api_key'] }}"
      Accept: "application/json"
    validate_certs: false
    timeout: 10
    status_code: [200, 401, 403]
  register: misp_reachability_test
  ignore_errors: true

- name: "[TEST] MISP reachability result"
  ansible.builtin.debug:
    msg: >
      {% if misp_reachability_test.status | default(0) == 200 %}
        MISP reachable and API key VALID (HTTP 200)
      {% elif misp_reachability_test.status | default(0) in [401, 403] %}
        MISP reachable but API key REJECTED (HTTP {{ misp_reachability_test.status }})
           → Regenerate key on docker-server and re-run.
      {% else %}
        MISP NOT reachable from ng-siem ({{ misp_reachability_test.msg | default('timeout/refused') }})
           → Check firewall rules between ng-siem and docker-server (port 8443).
      {% endif %}

# ── Test 2: Wazuh → DFIR-IRIS connectivity ───────────────────────────────────

- name: "[TEST] Wazuh → DFIR-IRIS: check API reachability"
  ansible.builtin.uri:
    url: "http://10.0.12.60:8083/api/v1/users/me"
    method: GET
    headers:
      Authorization: "Bearer {{ hostvars['docker-server']['iris_api_key'] }}"
      Content-Type: "application/json"
    validate_certs: false
    timeout: 10
    status_code: [200, 401, 403]
  register: iris_reachability_test
  ignore_errors: true

- name: "[TEST] DFIR-IRIS reachability result"
  ansible.builtin.debug:
    msg: >
      {% if iris_reachability_test.status | default(0) == 200 %}
        DFIR-IRIS reachable and API key VALID (HTTP 200)
           User: {{ iris_reachability_test.json.data.user_name | default('unknown') }}
      {% elif iris_reachability_test.status | default(0) in [401, 403] %}
        DFIR-IRIS reachable but API key REJECTED (HTTP {{ iris_reachability_test.status }})
           → Check iris_api_key extraction logic in docker-server role.
      {% else %}
        DFIR-IRIS NOT reachable from ng-siem ({{ iris_reachability_test.msg | default('timeout/refused') }})
           → Check firewall/port 8083, and that iris_nginx container is running.
      {% endif %}

# ── Test 3: send a synthetic alert to DFIR-IRIS ───────────────────────────────

- name: "[TEST] Send synthetic Wazuh-style alert to DFIR-IRIS"
  ansible.builtin.uri:
    url: "http://10.0.12.60:8083/api/v1/alerts/add"
    method: POST
    headers:
      Authorization: "Bearer {{ hostvars['docker-server']['iris_api_key'] }}"
      Content-Type: "application/json"
    body_format: json
    body:
      alert_title: "Ansible Integration Test Alert"
      alert_description: "Synthetic alert sent by Ansible to verify Wazuh → DFIR-IRIS integration."
      alert_source: "Wazuh"
      alert_source_ref: "ansible-test-001"
      alert_source_link: ""
      alert_severity_id: 1
      alert_status_id: 2
      alert_source_content:
        rule:
          id: "99999"
          level: 3
          description: "Ansible integration test"
        agent:
          id: "000"
          name: "ng-siem"
    validate_certs: false
    timeout: 15
    status_code: [200, 201]
  register: iris_alert_test
  ignore_errors: true

- name: "[TEST] Synthetic alert result"
  ansible.builtin.debug:
    msg: >
      {% if iris_alert_test.status | default(0) in [200, 201] %}
        Synthetic alert CREATED in DFIR-IRIS
           Alert ID: {{ iris_alert_test.json.data.alert_id | default('see DFIR-IRIS UI') }}
           → Log into http://10.0.12.60:8083 and confirm it appears under Alerts.
      {% else %}
        Synthetic alert FAILED (HTTP {{ iris_alert_test.status | default('UNREACHABLE') }})
           Response: {{ iris_alert_test.json | default(iris_alert_test.msg) | default('no response') }}
      {% endif %}

# ── Test 4: check Wazuh integration log for errors ───────────────────────────

- name: "[TEST] Check Wazuh integrations log for recent errors"
  ansible.builtin.shell: |
    if [ -f /var/ossec/logs/integrations.log ]; then
      tail -50 /var/ossec/logs/integrations.log
    else
      echo "integrations.log not yet created (no alerts forwarded yet — this is normal)"
    fi
  register: wazuh_integration_log
  changed_when: false

- name: "[TEST] Wazuh integrations log (last 50 lines)"
  ansible.builtin.debug:
    var: wazuh_integration_log.stdout_lines

# ── Final summary ─────────────────────────────────────────────────────────────

- name: Integration test summary
  ansible.builtin.debug:
    msg:
      - "======================================="
      - "  CYBERRANGE INTEGRATION TEST SUMMARY  "
      - "======================================="
      - "MISP (CTI-SS):      HTTP {{ misp_reachability_test.status | default('FAIL') }}"
      - "DFIR-IRIS (CICMS):  HTTP {{ iris_reachability_test.status | default('FAIL') }}"
      - "Synthetic alert:    HTTP {{ iris_alert_test.status | default('FAIL') }}"
      - "======================================="
      - "Next steps:"
      - "  1. Verify alert in DFIR-IRIS UI → http://10.0.12.60:8083"
      - "  2. Trigger a Wazuh rule (level ≥ 7) from Kali and watch integrations.log"
      - "  3. Confirm MISP events appear in Wazuh manager logs"
