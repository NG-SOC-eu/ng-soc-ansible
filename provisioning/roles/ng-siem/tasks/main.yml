---
# 2. FILE SYSTEM & DIRECTORY FIXES (The "Wazuh-Indexer" fix)
- name: Create missing Wazuh Indexer log directory
  file:
    path: /var/log/wazuh-indexer
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0755'

# 3. NETWORKING & HOST RESOLUTION (The "Loopback" fix)
- name: Configure internal routing in /etc/hosts
  block:
    - name: Restore standard localhost entry
      lineinfile:
        path: /etc/hosts
        regexp: '^127.0.0.1'
        line: "127.0.0.1 localhost"

- name: Map SIEM FQDNs to Internal Pentest IP (ens4)
  lineinfile:
    path: /etc/hosts
    # This regex ensures we replace ANY existing entry for the domain
    regexp: '.*{{ item }}$'
    # Use ens4 specifically to avoid the 192.168.x.x management IP
    line: "{{ ansible_ens4.ipv4.address }} {{ item }}"
    state: present
  loop:
    - wazuh-indexer.mini.ngsiem.sph.gr
    - wazuh-manager.mini.ngsiem.sph.gr
    - wazuh-dashboard.mini.ngsiem.sph.gr
    - fluentd.mini.ngsiem.sph.gr
    - keycloak.mini.ngsiem.sph.gr
    - postgres.keycloak.mini.ngsiem.sph.gr
    - misp.mini.ngsiem.sph.gr
    - mariadb.misp.mini.ngsiem.sph.gr
    - redis.misp.mini.ngsiem.sph.gr
    - modules.misp.mini.ngsiem.sph.gr
    - zookeeper.mini.ngsiem.sph.gr
    - kafka.mini.ngsiem.sph.gr
    - ui.kafka.mini.ngsiem.sph.gr
    - navigator.mini.ngsiem.sph.gr
    - db.backend.mini.ngsiem.sph.gr
    - cache.backend.mini.ngsiem.sph.gr
    - backend.mini.ngsiem.sph.gr
    - guacamole.mini.ngsiem.sph.gr
    - iframe.mini.ngsiem.sph.gr
    - app.mini.ngsiem.sph.gr

- name: Restart Docker to apply new networking
  systemd:
    name: docker
    state: restarted

# 4. SERVICE RECOVERY
- name: Ensure Wazuh Indexer and Docker are restarted
  systemd:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  loop:
    - wazuh-indexer
    - wazuh-manager
    - docker

- name: Wait for Wazuh Indexer API to be ready (Port 9200)
  wait_for:
    port: 9200
    delay: 10
    timeout: 300

- name: Run Wazuh Dashboard Init (Imports Patterns)
  shell: "docker start wazuh-dashboard-init"
  register: init_result
  failed_when: false # It's okay if this is already finished
  changed_when: "init_result.rc == 0"

- name: Start Pandora UI Container
  docker_container:
    name: ui
    state: started
  register: ui_status

- name: Start SIEM Backend Engine
  docker_container:
    name: backend
    state: started
  register: backend_status

- name: Start Alerts Correlator
  docker_container:
    name: alerts-correlator
    state: started
  register: correlator_status

- name: Ensure Native Wazuh Dashboard Service is Running
  systemd:
    name: wazuh-dashboard
    state: started
    enabled: yes
  register: native_dash_status


## API Key Integrations ───────────────────────────────────────────────────────────────────
# Verify facts arrived from docker-server role ────────────────────────────────────
- name: Assert MISP API key was passed from docker-server role
  ansible.builtin.assert:
    that:
      - hostvars['docker-server']['misp_api_key'] is defined
      - hostvars['docker-server']['misp_api_key'] | trim != ''
    fail_msg: >
      misp_api_key is not set in hostvars['docker-server'].
      Ensure the docker-server role ran first AND set cacheable: yes on the fact.
      Also confirm your inventory hostname for that host is exactly 'docker-server'.

- name: Assert DFIR-IRIS API key was passed from docker-server role
  ansible.builtin.assert:
    that:
      - hostvars['docker-server']['iris_api_key'] is defined
      - hostvars['docker-server']['iris_api_key'] | trim != ''
    fail_msg: >
      iris_api_key is not set in hostvars['docker-server'].
      Same checklist as above.

# ── Step 1: discover how Wazuh is running ────────────────────────────────────
 
- name: Check if wazuh-manager systemd service exists
  ansible.builtin.command: systemctl status wazuh-manager
  register: wazuh_systemd
  changed_when: false
  failed_when: false
 
- name: Check if Wazuh is running in Docker
  ansible.builtin.command: docker ps --filter "name=wazuh" --format "{{ '{{' }}.Names{{ '}}' }}"
  register: wazuh_docker_containers
  changed_when: false
  failed_when: false
 
- name: Check if Wazuh manager container exists (common names)
  ansible.builtin.command: >
    docker ps -a --format "{{ '{{' }}.Names{{ '}}' }}"
  register: all_docker_containers
  changed_when: false
  failed_when: false
 
- name: Show Wazuh discovery results
  ansible.builtin.debug:
    msg:
      - "systemd wazuh-manager rc: {{ wazuh_systemd.rc }}"
      - "Docker containers with 'wazuh' in name: {{ wazuh_docker_containers.stdout_lines }}"
      - "All Docker containers: {{ all_docker_containers.stdout_lines }}"
 
# ── Step 2: find ossec.conf path ─────────────────────────────────────────────
# Native install: /var/ossec/etc/ossec.conf
# Docker install: could be a bind mount on the host, or inside the container
 
- name: Check if native ossec.conf exists
  ansible.builtin.stat:
    path: /var/ossec/etc/ossec.conf
  register: ossec_conf_native
 
- name: Find ossec.conf on host (bind mount from docker)
  ansible.builtin.find:
    paths:
      - /opt/wazuh
      - /opt/wazuh-docker
      - /home
      - /root
      - /etc/wazuh
    patterns: "ossec.conf"
    recurse: yes
  register: ossec_conf_find
  failed_when: false
 
- name: Show ossec.conf locations
  ansible.builtin.debug:
    msg:
      - "Native /var/ossec/etc/ossec.conf exists: {{ ossec_conf_native.stat.exists }}"
      - "Other locations found: {{ ossec_conf_find.files | map(attribute='path') | list }}"
 
# ── Step 3: set facts based on discovery ─────────────────────────────────────
 
- name: Set wazuh_mode to native
  ansible.builtin.set_fact:
    wazuh_mode: "native"
    wazuh_ossec_conf: "/var/ossec/etc/ossec.conf"
    wazuh_integrations_dir: "/var/ossec/integrations"
  when: ossec_conf_native.stat.exists and wazuh_systemd.rc == 0
 
- name: Set wazuh_mode to docker
  ansible.builtin.set_fact:
    wazuh_mode: "docker"
    wazuh_container: "{{ wazuh_docker_containers.stdout_lines | select('match', '.*wazuh.*manager.*|.*wazuh.*') | first | default(wazuh_docker_containers.stdout_lines | first | default('wazuh.manager')) }}"
    wazuh_ossec_conf: "{{ ossec_conf_find.files[0].path if ossec_conf_find.files | length > 0 else '/var/ossec/etc/ossec.conf' }}"
  when: >
    not ossec_conf_native.stat.exists or wazuh_systemd.rc != 0
 
- name: Show resolved Wazuh mode
  ansible.builtin.debug:
    msg:
      - "Wazuh mode: {{ wazuh_mode }}"
      - "ossec.conf path: {{ wazuh_ossec_conf }}"
      - "Container (if docker): {{ wazuh_container | default('n/a') }}"
 
# ── Step 4: find integrations directory ──────────────────────────────────────
 
- name: Find Wazuh integrations directory (docker bind mount)
  ansible.builtin.find:
    paths:
      - /opt/wazuh
      - /opt/wazuh-docker
      - /home
      - /root
    patterns: "integrations"
    file_type: directory
    recurse: yes
  register: integrations_dir_find
  when: wazuh_mode == "docker"
  failed_when: false
 
- name: Set integrations dir for docker mode
  ansible.builtin.set_fact:
    wazuh_integrations_dir: "{{ integrations_dir_find.files[0].path if (integrations_dir_find.files | default([]) | length > 0) else '/var/ossec/integrations' }}"
  when: wazuh_mode == "docker"
 
# ── Step 5: deploy custom-iris integration script ────────────────────────────
 
- name: Ensure integrations directory exists on host
  ansible.builtin.file:
    path: "{{ wazuh_integrations_dir }}"
    state: directory
    mode: '0755'
  when: wazuh_mode == "native"
 
- name: Deploy custom-iris script (native mode - to host filesystem)
  ansible.builtin.copy:
    dest: "{{ wazuh_integrations_dir }}/custom-iris"
    mode: '0750'
    owner: root
    group: wazuh
    content: |
      #!/usr/bin/env python3
      import sys, json, requests, urllib3
      urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
      alert_file = sys.argv[1]
      api_key    = sys.argv[2]
      hook_url   = sys.argv[3]
      with open(alert_file) as f:
          alert = json.load(f)
      rule  = alert.get("rule", {})
      agent = alert.get("agent", {})
      payload = {
          "alert_title":       rule.get("description", "Wazuh Alert"),
          "alert_description": json.dumps(alert, indent=2),
          "alert_source":      "Wazuh",
          "alert_source_ref":  alert.get("id", ""),
          "alert_source_link": "",
          "alert_severity_id": 2,
          "alert_status_id":   2,
          "alert_source_content": alert,
          "alert_context": {
              "agent_name":  agent.get("name", ""),
              "agent_id":    agent.get("id", ""),
              "rule_id":     rule.get("id", ""),
              "rule_level":  rule.get("level", 0),
              "rule_groups": rule.get("groups", []),
          }
      }
      headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}
      try:
          r = requests.post(hook_url, json=payload, headers=headers, verify=False, timeout=10)
          r.raise_for_status()
      except requests.exceptions.RequestException as e:
          print(f"ERROR: {e}", file=sys.stderr)
          sys.exit(1)
      sys.exit(0)
  when: wazuh_mode == "native"
 
- name: Deploy custom-iris script (docker mode - via docker cp)
  ansible.builtin.shell: |
    cat > /tmp/custom-iris << 'PYEOF'
    #!/usr/bin/env python3
    import sys, json, requests, urllib3
    urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
    alert_file = sys.argv[1]
    api_key    = sys.argv[2]
    hook_url   = sys.argv[3]
    with open(alert_file) as f:
        alert = json.load(f)
    rule  = alert.get("rule", {})
    agent = alert.get("agent", {})
    payload = {
        "alert_title":       rule.get("description", "Wazuh Alert"),
        "alert_description": json.dumps(alert, indent=2),
        "alert_source":      "Wazuh",
        "alert_source_ref":  alert.get("id", ""),
        "alert_source_link": "",
        "alert_severity_id": 2,
        "alert_status_id":   2,
        "alert_source_content": alert,
        "alert_context": {
            "agent_name":  agent.get("name", ""),
            "agent_id":    agent.get("id", ""),
            "rule_id":     rule.get("id", ""),
            "rule_level":  rule.get("level", 0),
            "rule_groups": rule.get("groups", []),
        }
    }
    headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}
    try:
        r = requests.post(hook_url, json=payload, headers=headers, verify=False, timeout=10)
        r.raise_for_status()
    except requests.exceptions.RequestException as e:
        print(f"ERROR: {e}", file=sys.stderr)
        sys.exit(1)
    sys.exit(0)
    PYEOF
    chmod 750 /tmp/custom-iris
    docker exec {{ wazuh_container }} mkdir -p /var/ossec/integrations
    docker cp /tmp/custom-iris {{ wazuh_container }}:/var/ossec/integrations/custom-iris
    docker exec {{ wazuh_container }} chmod 750 /var/ossec/integrations/custom-iris
    docker exec {{ wazuh_container }} chown root:wazuh /var/ossec/integrations/custom-iris 2>/dev/null || true
    echo "Done"
  when: wazuh_mode == "docker"
  changed_when: true
 
# ── Step 6: inject ossec.conf integration block ───────────────────────────────
# For docker mode we edit the bind-mounted file on the host if found,
# otherwise edit it inside the container directly.
 
- name: Inject MISP and DFIR-IRIS integrations into ossec.conf (native or host bind mount)
  ansible.builtin.blockinfile:
    path: "{{ wazuh_ossec_conf }}"
    insertbefore: "</ossec_config>"
    marker: "<!-- {mark} ANSIBLE MANAGED CYBERRANGE INTEGRATIONS -->"
    block: |
      <!-- Integration with CTI-SS (MISP) -->
      <integration>
        <name>misp</name>
        <api_key>{{ hostvars['docker-server']['misp_api_key'] }}</api_key>
        <url>https://10.0.12.60:8443</url>
        <alert_format>json</alert_format>
      </integration>
 
      <!-- Integration with CICMS (DFIR-IRIS) -->
      <integration>
        <name>custom-iris</name>
        <url>http://10.0.12.60:8083/api/v1/alerts/add</url>
        <api_key>{{ hostvars['docker-server']['iris_api_key'] }}</api_key>
        <level>7</level>
        <alert_format>json</alert_format>
      </integration>
  when: >
    wazuh_mode == "native" or
    (wazuh_mode == "docker" and ossec_conf_find.files | default([]) | length > 0)

 - name: Inject integrations into ossec.conf inside container (docker, no bind mount)
  ansible.builtin.shell: |
    docker exec {{ wazuh_container }} sh -c "
    grep -q 'ANSIBLE MANAGED CYBERRANGE' /var/ossec/etc/ossec.conf && exit 0
    sed -i 's|</ossec_config>|<!-- BEGIN ANSIBLE MANAGED CYBERRANGE INTEGRATIONS -->\n<integration>\n  <name>misp</name>\n  <api_key>{{ hostvars['docker-server']['misp_api_key'] }}</api_key>\n  <url>https://10.0.12.60:8443</url>\n  <alert_format>json</alert_format>\n</integration>\n<integration>\n  <name>custom-iris</name>\n  <url>http://10.0.12.60:8083/api/v1/alerts/add</url>\n  <api_key>{{ hostvars['docker-server']['iris_api_key'] }}</api_key>\n  <level>7</level>\n  <alert_format>json</alert_format>\n</integration>\n<!-- END ANSIBLE MANAGED CYBERRANGE INTEGRATIONS -->\n</ossec_config>|' /var/ossec/etc/ossec.conf
    "
  when: >
    wazuh_mode == "docker" and
    (ossec_conf_find.files | default([]) | length == 0)
  changed_when: true

