- name: Add Wazuh FQDNs to /etc/hosts
  lineinfile:
    path: /etc/hosts
    # This looks up the IP of 'ng-siem' from the inventory
    line: "{{ hostvars['ng-siem']['ansible_ens4']['ipv4']['address'] }} {{ item }}"
    #line: "10.0.16.60 {{ item }}"
    regexp: ".*{{ item }}$"
    state: present
  loop:
    - keycloak.kafka.mini.ngsiem.sph.gr
    - misp.kafka.mini.ngsiem.sph.gr
    - backend.mini.ngsiem.sph.gr
    - navigator.mini.ngsiem.sph.gr
    - iframe.mini.ngsiem.sph.gr
    - wazuh-dashboard.kafka.mini.ngsiem.sph.gr
    - app.mini.ngsiem.sph.gr

# Pre-create MSF history files so rsyslog imfile does not crash on missing files.
# rsyslog segfaults/SIGABRTs when PersistStateInterval="1" is set on a file
# that doesn't exist yet — touch them first so the inode is present at rsyslog startup.
- name: Pre-create MSF history files before sandbox-logging
  ansible.builtin.shell: |
    # imfile PersistStateInterval writes state files to /var/lib/rsyslog/
    # If that directory is missing, rsyslog crashes with a fatal signal on restart
    mkdir -p /var/lib/rsyslog
    for f in \
      /root/.msf4/history \
      /var/lib/postgresql/.msf4/history \
      /home/kali/.msf4/history \
      /home/debian/.msf4/history \
      /home/user/.msf4/history; do
      mkdir -p "$(dirname "$f")"
      touch "$f"
    done
  changed_when: false
  ignore_errors: true
  when:
    - ansible_system == "Linux"
    - inventory_hostname not in ['proxy-jump', 'man']

- name: Set up command logging
  ansible.builtin.include_role:
    name: sandbox-logging
  vars:
    slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
  when: 
    - ansible_system == "Linux"
    - inventory_hostname not in ['proxy-jump', 'man']
