---
# 1. NETWORK & ACCESS
- name: Set Network Profile to Private
  ansible.windows.win_shell: |
    $Profile = Get-NetConnectionProfile
    if ($Profile.NetworkCategory -ne 'Private') {
        Set-NetConnectionProfile -NetworkCategory Private
    }
  register: profile_change
  changed_when: false

- name: Enable RDP & Disable NLA
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
  loop:
    - { path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server', name: 'fDenyTSConnections', data: 0 }
    - { path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp', name: 'UserAuthentication', data: 0 }

- name: Kill the Firewall (The Lab Way)
  community.windows.win_firewall:
    state: disabled
    profiles: [Domain, Private, Public]

# 2. Necessary for not rebooting or shuting down
- name: Stop and disable Windows Update
  ansible.windows.win_service:
    name: wuauserv
    state: stopped
    start_mode: disabled

- name: Attempt License Rearm
  ansible.windows.win_shell: slmgr.vbs /rearm
  register: rearm_result
  failed_when: false # Continue even if rearm limit reached

- name: Force Disable Software Protection Service (Registry Bypass)
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\sppsvc
    name: Start
    data: 4
    type: dword

- name: Kill Scheduled Shutdown Tasks
  ansible.windows.win_shell: |
    schtasks /change /tn "\Microsoft\Windows\Software Protection Platform\SvcRestartTask" /disable
    schtasks /change /tn "\Microsoft\Windows\Software Protection Platform\SvcRestartTaskLogon" /disable
  ignore_errors: yes

- name: Disable Auto-Reboot Registry
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: NoAutoRebootWithLoggedOnUsers
    data: 1
    type: dword

- name: Cancel any pending shutdowns immediately
  ansible.windows.win_shell: shutdown /a
  ignore_errors: yes

# 3. USER MANAGEMENT
- name: Set User Password and Persistence
  ansible.windows.win_user:
    name: windows
    password: "qwerty!23"
    state: present
    password_never_expires: yes
    update_password: always
