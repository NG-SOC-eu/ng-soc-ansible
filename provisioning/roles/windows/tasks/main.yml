############## Necessary for not rebooting or shuting down

- name: Stop and disable wuauserv service
  ansible.windows.win_service:
    name: wuauserv
    state: stopped
    start_mode: disabled

- name: Disable Software Protection Service (License Checks)
  ansible.windows.win_service:
    name: sppsvc
    start_mode: disabled
  ignore_errors: yes

- name: Disable Hourly Shutdown Task (Software Protection Platform)
  community.windows.win_scheduled_task:
    name: 'SvcRestartTask'
    path: '\Microsoft\Windows\Software Protection Platform'
    enabled: false
  ignore_errors: yes

- name: Disable Automatic Reboot for Updates via Registry
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: NoAutoRebootWithLoggedOnUsers
    data: 1
    type: dword
    state: present

##################### Necessary for Access

- name: Enable RDP & Disable NLA (Registry)
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: 0
    type: dword
  loop:
    - { path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server', name: 'fDenyTSConnections' }
    - { path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp', name: 'UserAuthentication' }

- name: Allow Ping (ICMP) - This fixes your "Cannot Ping" issue
  community.windows.win_firewall_rule:
    name: Allow ICMPv4-In
    protocol: icmpv4
    action: allow
    direction: in
    enabled: yes
    state: present

- name: Ensure Firewall allows RDP and WinRM
  ansible.windows.win_shell: |
    Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    Enable-NetFirewallRule -DisplayGroup "Windows Remote Management"
  ignore_errors: true

