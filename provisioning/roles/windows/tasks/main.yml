---
############# Disabling Windows Updates, License Monitoring, And Software Platform Protection
- name: Stop and disable wuauserv service
  ansible.windows.win_service:
    name: wuauserv
    state: stopped
    start_mode: disabled

- name: Disable Automatic Reboot for Updates via Registry
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: NoAutoRebootWithLoggedOnUsers
    data: 1
    type: dword
    state: present

- name: Disable Windows Licensing Monitoring Service (WLMS)
  ansible.windows.win_service:
    name: WLMS
    start_mode: disabled
    state: stopped
  ignore_errors: yes
    
#################### Defuse the Windows Evaluation Shutdowns

- name: Create PS directory
  ansible.windows.win_file:
    path: C:\PS
    state: directory

- name: Download PsTools from Sysinternals
  ansible.windows.win_get_url:
    url: https://download.sysinternals.com/files/PSTools.zip
    dest: C:\PS\PSTools.zip

- name: Unzip PsTools
  community.windows.win_unzip:
    src: C:\PS\PSTools.zip
    dest: C:\PS\
    creates: C:\PS\psexec.exe

- name: Kill WLMS Process immediately
  ansible.windows.win_shell: Stop-Process -Name "wlms" -Force
  ignore_errors: yes

- name: Delete WLMS Service via PsExec (SYSTEM privileges)
  ansible.windows.win_shell: |
    .\psexec.exe -accepteula -i -s sc delete WLMS
  args:
    chdir: C:\PS\
  ignore_errors: yes

- name: Force Delete WLMS Registry Key via PsExec
  ansible.windows.win_shell: |
    .\psexec.exe -accepteula -i -s reg delete "HKLM\SYSTEM\CurrentControlSet\Services\WLMS" /f
  args:
    chdir: C:\PS\
  ignore_errors: yes

- name: Disable License Validation Task
  ansible.windows.win_shell: |
    'Get-ScheduledTask -TaskPath "\Microsoft\Windows\SoftwareProtectionPlatform\" | Disable-ScheduledTask | Unregister-ScheduledTask -Confirm:$false'
  ignore_errors: yes

- name: Disable License Validation Tasks (Wildcard approach)
  ansible.windows.win_shell: |
    Get-ScheduledTask -Name *SvcRestartTask* | Disable-ScheduledTask
    Get-ScheduledTask -Name *LicenseScan* | Disable-ScheduledTask
  ignore_errors: yes

#- name: Hard disable WLMS via Registry
#  ansible.windows.win_regedit:
#    path: HKLM:\SYSTEM\CurrentControlSet\Services\WLMS
#    name: Start
#    data: 4
#    type: dword
#    state: present

- name: Final attempt to abort any active shutdown timers
  ansible.windows.win_shell: shutdown /a
  ignore_errors: yes

############## Network Access

- name: Set Network Profile to Private
  ansible.windows.win_shell: |
    $Profile = Get-NetConnectionProfile
    if ($Profile.NetworkCategory -ne 'Private') {
        Set-NetConnectionProfile -NetworkCategory Private
    }
  register: profile_change
  changed_when: profile_change.stdout != ""

- name: Enable RDP & Disable NLA (Registry)
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: 0
    type: dword
  loop:
    - { path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server', name: 'fDenyTSConnections' }
    - { path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp', name: 'UserAuthentication' }

- name: Allow Ping (ICMP) - This fixes your "Cannot Ping" issue
  community.windows.win_firewall_rule:
    name: Allow ICMPv4-In
    protocol: icmpv4
    action: allow
    direction: in
    enabled: yes
    state: present

- name: Ensure Firewall allows RDP and WinRM
  ansible.windows.win_shell: |
    Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    Enable-NetFirewallRule -DisplayGroup "Windows Remote Management"
  ignore_errors: true

- name: Open Firewall Ports Explicitly (WinRM & RDP)
  community.windows.win_firewall_rule:
    name: "Ansible-{{ item.name }}"
    localport: "{{ item.port }}"
    action: allow
    direction: in
    protocol: tcp
    state: present
  loop:
    - { name: 'WinRM-HTTP', port: '5985' }
    - { name: 'WinRM-HTTPS', port: '5986' }
    - { name: 'RDP', port: '3389' }

- name: Completely Disable Firewall
  community.windows.win_firewall:
    state: disabled
    profiles:
      - Domain
      - Private
      - Public

############## Recheck to adort a shutdown

- name: Abort any pending shutdowns
  ansible.windows.win_shell: shutdown /a
  ignore_errors: yes
#################### User Access

- name: Change Windows User Password
  ansible.windows.win_user:
    name: windows
    password: "qwerty!23"
    state: present
    password_never_expires: yes
    update_password: always
