---
- name: Configuring Docker-Server
  hosts: docker-server
  become: yes
  roles:
    - docker_server

- name: Configure Kali
  hosts: kali
  become: yes
  roles:
    - kali
  
- name: Configuring victim PC
  hosts: victim
  become: yes
  roles:
    - victim

- name: Configure hosts file
  hosts: all
  become: true
  roles:
    - all

- name: set up command logging
  hosts: all
  become: yes
  roles:
    - role: sandbox-logging
      slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
      when: ansible_system == "Linux"
