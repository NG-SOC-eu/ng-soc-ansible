---
- name: Configuring Docker-Server
  hosts: docker-server
  become: yes
  roles:
    - docker_server

- name: Configuring NG-SIEM
  hosts: ng-siem
  become: yes
  roles:
    - ng-siem

- name: Configure Kali
  hosts: kali
  become: yes
  roles:
    - kali

- name: Configuring victim PC
  hosts: victim
  become: yes
  roles:
    - victim

- name: Configure to all systems (logging, hosts, etc)
  hosts: all
  become: true
  roles:
    - all

- name: Changing syslog-ng on man
  hosts: man
  become: yes
  roles:
    - man

- name: set up command logging
  hosts: 
    - routers
    - hosts
  become: yes
  roles:
    - role: sandbox-logging
      slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
      when: ansible_system == "Linux"

- name: setup hosts logging roles
  hosts:
    - routers
    - hosts
  become: yes
  vars:
    sandbox_name: junior-hacker-local
    central_syslog_ip: 78.128.251.179
  roles:
    - role: sandbox-logging
      slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
      slf_destination: '{% if hostvars["man"] is defined -%} {{ hostvars["man"].ansible_host }} {%- else -%} {{ central_syslog_ip }} {%- endif %}'
      slf_sandbox_id: "{{ global_sandbox_id | default(student_id) | default(0) }}"
      slf_sandbox_name: '{{ global_sandbox_name | default(sandbox_name) }}'
      slf_pool_id: '{{ global_pool_id | default(None) }}'
